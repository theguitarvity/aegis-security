release_gate:
  fail_when:
    critical_open_findings_gte: 1
    high_open_findings_gt: 2
    confirmed_runtime_exploit: true
    secret_exposure: true
  warn_when:
    medium_open_findings_gt: 10
    sbom_missing: true
    skipped_required_tools: true
  score:
    start: 100
    critical: -25
    high: -12
    medium: -5
    low: -1
    info: 0
    minimum: 0
